        function initLoading() {
            const loading = document.querySelector(".loading");
            const currentDomain = window.location.hostname;
            const referrer = document.referrer;

            
            const isNewVisit = !referrer || !referrer.includes(currentDomain);

            if (isNewVisit) {
                loading.style.display = "flex"; 
                
                
                setTimeout(() => {
                    loading.classList.add("loading-fadeout");
                }, 1200); 

                
                setTimeout(() => {
                    loading.style.display = "none";
                }, 2500);
            } else {
                loading.style.display = "none"; 
            }
        }

        document.addEventListener('DOMContentLoaded', initLoading);

        <script>
            const musicList = [
                { src: "/audio/1.mp3", title: "See you soon" },
                { src: "/audio/flower.mp3", title: "Flower dance" },
            ];

            const audio = document.getElementById('bg-music');
            const titleEl = document.getElementById('music-title');
            const playBtn = document.getElementById('play-btn');
            const volumeControl = document.getElementById('volume-control');
            let currentTrack = 0;
            audio.volume = 0.3;

            
            function restoreState() {
                const savedTrack = localStorage.getItem('currentMusicTrack');
                if (savedTrack) currentTrack = parseInt(savedTrack);
                
                const savedTime = localStorage.getItem('musicPlayTime');
                if (savedTime) audio.currentTime = parseFloat(savedTime);
                
                const isPlaying = localStorage.getItem('musicIsPlaying') === 'true';
                const savedVolume = localStorage.getItem('musicVolume');
                if (savedVolume) {
                    audio.volume = parseFloat(savedVolume);
                    volumeControl.value = audio.volume;
                }
                
                audio.src = musicList[currentTrack].src;
                titleEl.textContent = `正在播放：${musicList[currentTrack].title}`;
                
                if (isPlaying) {
                    audio.play().then(() => {
                        playBtn.innerHTML = '⏸️ 暂停';
                    }).catch(err => console.log('自动播放被阻止：', err));
                }
            }

            
            function saveState() {
                localStorage.setItem('currentMusicTrack', currentTrack);
                localStorage.setItem('musicPlayTime', audio.currentTime);
                localStorage.setItem('musicIsPlaying', !audio.paused);
                localStorage.setItem('musicVolume', audio.volume);
            }

            
            function togglePlay() {
                if (audio.paused) {
                    audio.play();
                    playBtn.innerHTML = '⏸️ 暂停';
                } else {
                    audio.pause();
                    playBtn.innerHTML = '▶️ 播放';
                }
                saveState();
            }

            
            function prevMusic() {
                currentTrack = (currentTrack - 1 + musicList.length) % musicList.length;
                audio.src = musicList[currentTrack].src;
                titleEl.textContent = `正在播放：${musicList[currentTrack].title}`;
                audio.play();
                playBtn.innerHTML = '⏸️ 暂停';
                saveState();
            }

            
            function nextMusic() {
                currentTrack = (currentTrack + 1) % musicList.length;
                audio.src = musicList[currentTrack].src;
                titleEl.textContent = `正在播放：${musicList[currentTrack].title}`;
                audio.play();
                playBtn.innerHTML = '⏸️ 暂停';
                saveState();
            }

            
            volumeControl.addEventListener('input', function() {
                audio.volume = this.value;
                saveState();
            });

            
            audio.addEventListener('ended', function() {
                nextMusic();
            });

            
            audio.addEventListener('timeupdate', saveState);
            audio.addEventListener('play', saveState);
            audio.addEventListener('pause', saveState);

            
            window.onload = restoreState;
        </script>

  return new Promise((resolve, reject) => {
    let tag;

    if (type === 'css') {
      tag = document.createElement('link');
      tag.rel = 'stylesheet';
      tag.href = url;
    }
    else if (type === 'js') {
      tag = document.createElement('script');
      tag.type = 'module';
      tag.src = url;
    }
    if (tag) {
      tag.onload = () => resolve(url);
      tag.onerror = () => reject(url);
      document.head.appendChild(tag);
    }
  });
}
